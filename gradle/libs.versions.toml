[versions]
agp                       = "9.3.3"
ktor                      = "3.1.3"
koin                      = "4.0.4"
koin-compose              = "4.0.4"
kotlinx-datetime          = "0.7.1"
android-compileSdk        = "36"
android-minSdk            = "24"
android-targetSdk         = "36"
androidx-activity         = "1.13.0"
androidx-appcompat        = "1.8.0"
androidx-core             = "1.19.0"
androidx-espresso         = "3.7.0"
androidx-lifecycle        = "2.11.0-beta01"
androidx-testExt          = "1.3.0"
compose-bom               = "2024.12.01"
composeMultiplatform      = "1.11.1"
navigation-compose        = "2.9.0-beta01"
junit                     = "4.13.2"
kotlin                    = "2.4.10"
kotlin-wrappers           = "2026.8.4"
kotlinx-coroutines        = "1.11.0"
material3                 = "1.11.0-alpha07"
retrofit                  = "2.11.0"
okhttp                    = "4.12.0"
gson                      = "2.11.0"
datastore                 = "1.1.7"
play-services-location    = "21.3.0"
maps-compose              = "6.4.1"
accompanist-permissions   = "0.37.2"
sqldelight                = "2.1.0"
osmdroid                  = "6.1.20"

[libraries]
# ── Test ──────────────────────────────────────────────────────────────────────
kotlin-test              = { module = "org.jetbrains.kotlin:kotlin-test",              version.ref = "kotlin" }
kotlin-testJunit         = { module = "org.jetbrains.kotlin:kotlin-test-junit",        version.ref = "kotlin" }
junit                    = { module = "junit:junit",                                   version.ref = "junit" }
androidx-testExt-junit   = { module = "androidx.test.ext:junit",                       version.ref = "androidx-testExt" }
androidx-espresso-core   = { module = "androidx.test.espresso:espresso-core",          version.ref = "androidx-espresso" }

# ── AndroidX core ─────────────────────────────────────────────────────────────
androidx-core-ktx         = { module = "androidx.core:core-ktx",                       version.ref = "androidx-core" }
androidx-appcompat        = { module = "androidx.appcompat:appcompat",                 version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose",           version.ref = "androidx-activity" }

# ── Lifecycle Android puro (para androidApp) — alias ÚNICOS ──────────────────
# Prefijo "android-lifecycle" para evitar clash con las entradas KMP de abajo
android-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
android-lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "androidx-lifecycle" }

# ── Compose BOM (solo para androidApp) ───────────────────────────────────────
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }

# ── Compose Android puro — versión manejada por BOM (sin version.ref) ─────────
android-compose-ui               = { module = "androidx.compose.ui:ui" }
android-compose-ui-graphics      = { module = "androidx.compose.ui:ui-graphics" }
android-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
android-compose-ui-tooling       = { module = "androidx.compose.ui:ui-tooling" }
android-compose-foundation       = { module = "androidx.compose.foundation:foundation" }
android-compose-animation        = { module = "androidx.compose.animation:animation" }
android-compose-material3        = { module = "androidx.compose.material3:material3" }
android-compose-runtime          = { module = "androidx.compose.runtime:runtime" }

# ── Compose KMP / Multiplatform (para :app:shared commonMain) ─────────────────
kmp-compose-uiTooling            = { module = "org.jetbrains.compose.ui:ui-tooling",                version.ref = "composeMultiplatform" }
kmp-compose-uiToolingPreview     = { module = "org.jetbrains.compose.ui:ui-tooling-preview",         version.ref = "composeMultiplatform" }
kmp-compose-runtime              = { module = "org.jetbrains.compose.runtime:runtime",               version.ref = "composeMultiplatform" }
kmp-compose-foundation           = { module = "org.jetbrains.compose.foundation:foundation",         version.ref = "composeMultiplatform" }
kmp-compose-material3            = { module = "org.jetbrains.compose.material3:material3",           version.ref = "material3" }
kmp-compose-ui                   = { module = "org.jetbrains.compose.ui:ui",                         version.ref = "composeMultiplatform" }
kmp-compose-resources            = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

# ── Navigation KMP (para :app:shared) ─────────────────────────────────────────
kmp-navigation-compose           = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# ── Lifecycle KMP (para :app:shared) — alias ÚNICOS con prefijo "kmp" ─────────
kmp-lifecycle-viewmodel-compose  = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
kmp-lifecycle-runtime-compose    = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "androidx-lifecycle" }

# ── Misc KMP ──────────────────────────────────────────────────────────────────
kotlinx-coroutinesSwing          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing",       version.ref = "kotlinx-coroutines" }
wrappers-browser                 = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser",          version.ref = "kotlin-wrappers" }

# ── Retrofit + OkHttp + Gson ──────────────────────────────────────────────────
retrofit-core     = { module = "com.squareup.retrofit2:retrofit",               version.ref = "retrofit" }
retrofit-gson     = { module = "com.squareup.retrofit2:converter-gson",         version.ref = "retrofit" }
okhttp-core       = { module = "com.squareup.okhttp3:okhttp",                   version.ref = "okhttp" }
okhttp-logging    = { module = "com.squareup.okhttp3:logging-interceptor",      version.ref = "okhttp" }
gson              = { module = "com.google.code.gson:gson",                     version.ref = "gson" }

# ── DataStore ─────────────────────────────────────────────────────────────────
datastore-preferences = { module = "androidx.datastore:datastore-preferences",  version.ref = "datastore" }

# ── Coroutines Android ────────────────────────────────────────────────────────
kotlinx-coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# ── Maps + Location ───────────────────────────────────────────────────────────
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }
maps-compose           = { module = "com.google.maps.android:maps-compose",          version.ref = "maps-compose" }
osmdroid-android       = { module = "org.osmdroid:osmdroid-android",                 version.ref = "osmdroid" }

# ── Accompanist ───────────────────────────────────────────────────────────────
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist-permissions" }

# ── Ktor Client KMP ───────────────────────────────────────────────────────────
ktor-client-core         = { module = "io.ktor:ktor-client-core",                    version.ref = "ktor" }
ktor-client-android      = { module = "io.ktor:ktor-client-android",                 version.ref = "ktor" }
ktor-client-darwin       = { module = "io.ktor:ktor-client-darwin",                  version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json  = { module = "io.ktor:ktor-serialization-kotlinx-json",     version.ref = "ktor" }
ktor-client-logging      = { module = "io.ktor:ktor-client-logging",                 version.ref = "ktor" }
ktor-client-auth         = { module = "io.ktor:ktor-client-auth",                    version.ref = "ktor" }

# ── Koin KMP ──────────────────────────────────────────────────────────────────
koin-core                = { module = "io.insert-koin:koin-core",                    version.ref = "koin" }
koin-android             = { module = "io.insert-koin:koin-android",                 version.ref = "koin" }
koin-compose             = { module = "io.insert-koin:koin-compose",                 version.ref = "koin-compose" }
koin-compose-viewmodel   = { module = "io.insert-koin:koin-compose-viewmodel",       version.ref = "koin-compose" }

# ── kotlinx-datetime KMP ──────────────────────────────────────────────────────
kotlinx-datetime         = { module = "org.jetbrains.kotlinx:kotlinx-datetime",      version.ref = "kotlinx-datetime" }

# ── Coroutines Test (commonTest) ──────────────────────────────────────────────
kotlinx-coroutines-test  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# ── SQLDelight KMP ────────────────────────────────────────────────────────────
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver        = { module = "app.cash.sqldelight:android-driver",        version.ref = "sqldelight" }
sqldelight-native-driver         = { module = "app.cash.sqldelight:native-driver",         version.ref = "sqldelight" }
sqldelight-sqlite-driver         = { module = "app.cash.sqldelight:sqlite-driver",         version.ref = "sqldelight" }

[plugins]
androidApplication          = { id = "com.android.application",                    version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library",    version.ref = "agp" }
composeMultiplatform        = { id = "org.jetbrains.compose",                       version.ref = "composeMultiplatform" }
composeCompiler             = { id = "org.jetbrains.kotlin.plugin.compose",         version.ref = "kotlin" }
kotlinJvm                   = { id = "org.jetbrains.kotlin.jvm",                    version.ref = "kotlin" }
kotlinMultiplatform         = { id = "org.jetbrains.kotlin.multiplatform",          version.ref = "kotlin" }
kotlinSerialization         = { id = "org.jetbrains.kotlin.plugin.serialization",   version.ref = "kotlin" }
sqldelight                  = { id = "app.cash.sqldelight",                         version.ref = "sqldelight" }
