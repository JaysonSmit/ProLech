# Pruebas de la lógica compartida (commonTest) y APK de depuración en cada push.
name: App Android - pruebas y APK

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas (commonTest en JVM de Android)
        run: ./gradlew --no-daemon :composeApp:testAndroidHostTest

      - name: APK de depuración
        run: ./gradlew --no-daemon :composeAndroidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: prolech-acopio-debug
          path: composeAndroidApp/build/outputs/apk/debug/*.apk

      - name: Reporte de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: composeApp/build/reports/tests/
