# /etc/nginx/sites-available/prolech  — Laravel detrás de Nginx con HTTPS (Let's Encrypt / certbot).
# Reemplaza api.tu-dominio.pe por tu dominio. Certbot completa las rutas del certificado.

server {
    listen 80;
    listen [::]:80;
    server_name api.tu-dominio.pe;
    # Certbot responde el reto aquí; todo lo demás va a HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tu-dominio.pe;

    ssl_certificate     /etc/letsencrypt/live/api.tu-dominio.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tu-dominio.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/prolech/public;
    index index.php;
    charset utf-8;

    # Fotos de evidencia y comprobantes Yape
    client_max_body_size 12M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # Nunca servir archivos ocultos (.env, .git)
    location ~ /\.(?!well-known) { deny all; }
}
